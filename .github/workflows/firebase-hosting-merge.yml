name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pas d'etape de build : l'application est un fichier HTML statique,
      # publie tel quel. (npm ci echouerait, il n'y a pas de package.json.)
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PROJECT_BSM_7D32C }}
          channelId: live
          projectId: project-bsm-7d32c
