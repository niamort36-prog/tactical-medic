# Projet Xcode decrit en texte, pour ne pas versionner un .xcodeproj illisible.
# Sur le Mac :  brew install xcodegen && xcodegen generate
name: BSEMedical
options:
  bundleIdPrefix: com.bravosierraevents
  deploymentTarget:
    # 15.0 : en dessous, WKWebView ne sait pas accorder la camera au scanner
    # de QR code, et la prise en charge du service worker est incomplete.
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  BSEMedical:
    type: application
    platform: iOS
    sources:
      - path: BSEMedical
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bravosierraevents.bsemedical
        PRODUCT_NAME: BSE Medical
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: BSEMedical/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        # A remplir avec l'identifiant d'equipe du compte Apple Developer.
        DEVELOPMENT_TEAM: ""
